[workspace]
resolver = "2"
members = [
    "crates/rc-core",
    "crates/rc-discovery",
    "crates/rc-api",
    "crates/rc-server",
    "crates/rc-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Rust Commander contributors"]
repository = "https://github.com/bobnautic/rustcommander"
rust-version = "1.91"

[workspace.dependencies]
rc-core = { path = "crates/rc-core" }
rc-discovery = { path = "crates/rc-discovery" }
rc-api = { path = "crates/rc-api" }
rc-server = { path = "crates/rc-server" }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "compat"] }
futures = "0.3"
async-trait = "0.1"
bytes = "1"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot = "0.12"
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
sha1 = "0.10"
hex = "0.4"
rand = "0.8"
directories = "6"
dirs = "6"
globset = "0.4"
regex = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "json", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
opt-level = 3

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 1

[package]
name = "rc-core"
description = "Rust Commander core: virtual file systems, protocols, transfers, synchronization"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["ssh", "ftp", "cloud"]
# SFTP / SCP / SSH terminal / tunnels (russh)
ssh = ["dep:russh", "dep:russh-sftp"]
# FTP / FTPS (suppaftp)
ftp = []
# WebDAV / S3 / Azure Blob / Google Cloud Storage (OpenDAL)
cloud = []

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
async-trait.workspace = true
bytes.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true
parking_lot.workspace = true
base64.workspace = true
sha2.workspace = true
sha1.workspace = true
md-5.workspace = true
hex.workspace = true
rand.workspace = true
directories.workspace = true
globset.workspace = true
regex.workspace = true
filetime = "0.2"
fs4 = "1"
portable-pty = "0.9"
tokio-socks = "0.5"
notify = "8"
roxmltree = "0.20"
chacha20poly1305 = "0.10"
argon2 = "0.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
reqwest.workspace = true
rustls.workspace = true
russh = { version = "0.65", default-features = false, features = ["flate2", "ring", "rsa"], optional = true }
russh-sftp = { version = "3.0.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

name: Release

# A release is cut with "Run workflow" on the Actions tab (enter the version; the tag is
# created on the selected branch's commit) or by pushing a version tag:
#   git tag v0.2.0 && git push origin v0.2.0
# Every platform is built and tested first. Then the release is created as a draft with all
# downloads (DMG, Windows installer and portable exe, AppImage/deb/rpm, rcmd archives,
# SHA256SUMS.txt), the uploaded files are checked against the built ones, and only then the
# release is published. So a release never shows up without its downloads.
# A release published by hand on GitHub (with a new tag v<version>) works too: publishing
# creates the tag, which starts this workflow. The release shows a note with a link to the
# build until the downloads and the download table are added to it.
# Pull requests that change the packaging build and check all downloads as well (with the
# version in the repository, as workflow artifacts only; nothing is published).

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.2.0 or 0.3.0-beta.1 (tag v<version> is created on the selected branch)'
        required: true
      draft:
        description: 'Create the release as a draft (publish it by hand later)'
        type: boolean
        default: false
      dry-run:
        description: 'Only build the downloads (workflow artifacts), do not create a release'
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/set-version.mjs
      - scripts/release-notes.sh
      - src-tauri/tauri.conf.json

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch) v="${INPUT_VERSION#v}" ;;
            pull_request) v="$(jq -r .version src-tauri/tauri.conf.json)" ;;
            *) v="${GITHUB_REF_NAME#v}" ;;
          esac
          if ! [[ "$v" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::'$v' is not a version like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && git ls-remote --exit-code --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/v$v" >/dev/null; then
            echo "::error::Tag v$v already exists. Pick a new version or re-run the workflow of that tag."
            exit 1
          fi
          {
            echo "version=$v"
            echo "tag=v$v"
            echo "prerelease=$([[ "$v" == *-* ]] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "Version **v$v**" >> "$GITHUB_STEP_SUMMARY"

  announce:
    name: Announce build
    needs: prepare
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Note in a release created on GitHub
        run: |
          set -euo pipefail
          if ! assets=$(gh release view "$TAG" --json assets --jq '.assets | length' 2>/dev/null); then
            echo "No release $TAG yet, it is created when the downloads are built"
            exit 0
          fi
          if [ "$assets" != 0 ]; then
            echo "Release $TAG already has downloads (re-run), they are replaced at the end"
            exit 0
          fi
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > section.md <<EOF
          > **The downloads are being built** (macOS \`.dmg\`, Windows \`.exe\`, Linux packages, \`rcmd\`) and appear here in about 25 minutes: [build progress]($run).
          <!-- building -->
          EOF
          gh release view "$TAG" --json body --jq .body | bash scripts/release-notes.sh section.md > notes.md
          gh release edit "$TAG" --notes-file notes.md >/dev/null
          echo "Added a note to release $TAG"

  checks:
    name: Checks
    if: github.event_name != 'pull_request' # CI runs on the pull request itself
    uses: ./.github/workflows/ci.yml

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: prepare
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            target: universal-apple-darwin
            bundles: app,dmg
          - name: Windows
            os: windows-latest
            bundles: nsis
          # oldest supported Ubuntu, so the packages run on older glibc versions too
          - name: Linux
            os: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Set version ${{ env.VERSION }}
        run: node scripts/set-version.mjs "$VERSION"
        shell: bash
      - run: npm ci && npm --prefix ui ci
        shell: bash
      - name: Build
        shell: bash
        env:
          # Optional macOS signing and notarization (repository secrets). Without them the app is
          # ad-hoc signed (bundle.macOS.signingIdentity "-").
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUNDLES: ${{ matrix.bundles }}
          TARGET: ${{ matrix.target }}
        run: |
          # an empty variable would make the bundler try (and fail) to import a certificate
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!v}" ] || unset "$v"
          done
          # RPM versions cannot contain "-": a pre-release gets its .rpm in the next step
          if [ "$PRERELEASE" = true ]; then BUNDLES="${BUNDLES/,rpm/}"; fi
          args=(--bundles "$BUNDLES")
          if [ -n "$TARGET" ]; then args+=(--target "$TARGET"); fi
          npx tauri build "${args[@]}" -- --locked
      - name: RPM for a pre-release
        if: runner.os == 'Linux' && env.PRERELEASE == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # 0.2.0-beta.1 is packaged as version 0.2.0, release 0.beta.1 ("-" is not allowed in
          # either), which RPM sorts before the final 0.2.0 (release 1). The app inside is the
          # one built above and reports 0.2.0-beta.1.
          pre="${VERSION#*-}"
          config=$(jq -nc --arg v "${VERSION%%-*}" --arg r "0.${pre//-/_}" '{version: $v, bundle: {linux: {rpm: {release: $r}}}}')
          npx tauri bundle --bundles rpm --config "$config"
      - name: Collect downloads
        shell: bash
        run: |
          set -euo pipefail
          out=release-assets
          base="rustCommander-$VERSION"
          mkdir -p "$out"
          case "$RUNNER_OS" in
            macOS)
              cp target/universal-apple-darwin/release/bundle/dmg/*.dmg "$out/$base-macos-universal.dmg" ;;
            Windows)
              cp target/release/bundle/nsis/*-setup.exe "$out/$base-windows-x64-setup.exe"
              cp target/release/rust-commander.exe "$out/$base-windows-x64-portable.exe" ;;
            Linux)
              cp target/release/bundle/appimage/*.AppImage "$out/$base-linux-x86_64.AppImage"
              cp target/release/bundle/deb/*.deb "$out/$base-linux-amd64.deb"
              cp target/release/bundle/rpm/*.rpm "$out/$base-linux-x86_64.rpm" ;;
          esac
          ls -l "$out"
      - uses: actions/upload-artifact@v7
        with:
          name: release-desktop-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error

  rcmd:
    name: rcmd (${{ matrix.name }})
    needs: prepare
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-aarch64, os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: macos-arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set version ${{ env.VERSION }}
        run: node scripts/set-version.mjs "$VERSION"
        shell: bash
      - run: npm --prefix ui ci && npm --prefix ui run build
        shell: bash
      - run: cargo build --release --locked -p rc-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          dir="rcmd-$VERSION-${{ matrix.name }}"
          mkdir -p "$dir" release-assets
          cp LICENSE "$dir/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${{ matrix.target }}/release/rcmd.exe" "$dir/"
            7z a -tzip "release-assets/$dir.zip" "$dir" >/dev/null
          else
            cp "target/${{ matrix.target }}/release/rcmd" "$dir/"
            tar -czf "release-assets/$dir.tar.gz" "$dir"
          fi
          ls -l release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: release-rcmd-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error

  downloads:
    name: Downloads
    needs: [prepare, desktop, rcmd]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      MAC_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      # Runs on pull requests too, so a missing or renamed download fails there, not at release.
      - name: Check the downloads
        working-directory: dist
        run: |
          set -euo pipefail
          b="rustCommander-$VERSION"
          expected=(
            "$b-macos-universal.dmg"
            "$b-windows-x64-setup.exe"
            "$b-windows-x64-portable.exe"
            "$b-linux-x86_64.AppImage"
            "$b-linux-amd64.deb"
            "$b-linux-x86_64.rpm"
            "rcmd-$VERSION-linux-x86_64.tar.gz"
            "rcmd-$VERSION-linux-aarch64.tar.gz"
            "rcmd-$VERSION-macos-arm64.tar.gz"
            "rcmd-$VERSION-macos-x86_64.tar.gz"
            "rcmd-$VERSION-windows-x64.zip"
          )
          if ! diff -u <(printf '%s\n' "${expected[@]}" | sort) <(ls -1 | sort); then
            echo "::error::The downloads differ from the expected files (- missing, + unexpected)"
            exit 1
          fi
          if empty=$(find . -type f -empty) && [ -n "$empty" ]; then
            echo "::error::Empty downloads: $empty"
            exit 1
          fi
          mkdir -p ../index
          sha256sum -- * > ../index/SHA256SUMS.txt
          cat ../index/SHA256SUMS.txt
          {
            echo "### Downloads $VERSION"
            echo
            echo '```'
            du -h -- *
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Download table
        run: |
          set -euo pipefail
          b="rustCommander-$VERSION"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG"
          {
            echo "## Downloads"
            echo
            echo "| System | File |"
            echo "|---|---|"
            echo "| macOS 10.13+ (Apple silicon and Intel) | [\`$b-macos-universal.dmg\`]($url/$b-macos-universal.dmg) |"
            echo "| Windows 10/11, installer | [\`$b-windows-x64-setup.exe\`]($url/$b-windows-x64-setup.exe) |"
            echo "| Windows 10/11, portable (no installation) | [\`$b-windows-x64-portable.exe\`]($url/$b-windows-x64-portable.exe) |"
            echo "| Linux x86_64 | [\`.AppImage\`]($url/$b-linux-x86_64.AppImage) · [\`.deb\`]($url/$b-linux-amd64.deb) · [\`.rpm\`]($url/$b-linux-x86_64.rpm) |"
            echo "| Headless server and CLI (\`rcmd\`) | \`rcmd-$VERSION-<platform>.tar.gz\` / \`.zip\` below |"
            echo
            echo "Checksums: \`SHA256SUMS.txt\` (\`shasum -a 256 -c SHA256SUMS.txt --ignore-missing\`)."
            echo
            if [ "$MAC_SIGNED" != true ]; then
              echo "> **macOS:** the app is not notarized by Apple. On first start macOS refuses to open it —"
              echo "> open **System Settings → Privacy & Security** and click **Open Anyway**, or run"
              echo "> \`xattr -dr com.apple.quarantine \"/Applications/Rust Commander.app\"\`."
              echo
            fi
            echo "> **Windows:** the installer is not code-signed. If SmartScreen warns, click **More info → Run anyway**."
          } > index/downloads.md
          cat index/downloads.md
      # checksums and table only; the files themselves are taken from the release-* artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: download-index
          path: index/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, checks, downloads]
    if: ${{ github.event_name != 'pull_request' && !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
      PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
      DRAFT: ${{ inputs.draft || false }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: download-index
          path: index
      - name: Files of the release
        run: |
          set -euo pipefail
          mv index/SHA256SUMS.txt dist/
          # exactly the files that were checked in the Downloads job
          (cd dist && sha256sum -c --strict SHA256SUMS.txt)
          if [ "$(ls dist | wc -l)" != "$(($(wc -l < dist/SHA256SUMS.txt) + 1))" ]; then
            echo "::error::dist holds files that are not in SHA256SUMS.txt"
            exit 1
          fi
      - name: Tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          # A pushed tag brings its own. For "Run workflow" it is created now on the built commit.
          # Tags made with the workflow token start no second run of this workflow, so
          # publishing a draft by hand later does not rebuild everything.
          if sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha 2>/dev/null); then
            if [ "$sha" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG points to $sha, not to the built commit $GITHUB_SHA"
              exit 1
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
            echo "Created tag $TAG on $GITHUB_SHA"
          fi
      - name: Upload the files
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            # created on GitHub (or by an earlier attempt): add the files and the download
            # table, keep the notes written there
            echo "Release $TAG exists, adding its files"
            gh release upload "$TAG" dist/* --clobber
            gh release view "$TAG" --json body --jq .body | bash scripts/release-notes.sh index/downloads.md > notes.md
            gh release edit "$TAG" --notes-file notes.md >/dev/null
          else
            # a draft first: nobody sees the release before all files are on it
            # changes since the previous release (pull requests and contributors)
            gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body |
              bash scripts/release-notes.sh index/downloads.md > notes.md
            args=(--title "Rust Commander $TAG" --notes-file notes.md --verify-tag --draft)
            if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
            gh release create "$TAG" dist/* "${args[@]}"
          fi
      - name: Check the uploaded files
        run: |
          set -euo pipefail
          # every built file is on the release with its size and SHA-256 digest (GitHub reports
          # the digest of each uploaded file); one created by hand may hold more files
          (cd dist && for f in *; do echo "$f $(stat -c %s "$f") sha256:$(sha256sum < "$f" | cut -d' ' -f1)"; done) > built.txt
          gh release view "$TAG" --json assets --jq '.assets[] | select(.state == "uploaded") | "\(.name) \(.size) \(.digest // "")"' > uploaded.txt
          bad=$(awk 'NR == FNR { size[$1] = $2; digest[$1] = $3; next }
            !($1 in size) || size[$1] != $2 || (digest[$1] != "" && digest[$1] != $3) { print $1 }' uploaded.txt built.txt)
          if [ -n "$bad" ]; then
            echo "::error::Missing on release $TAG or different from the built file:"
            echo "$bad"
            exit 1
          fi
          echo "All $(wc -l < built.txt) files are on release $TAG"
      - name: Publish
        run: |
          set -euo pipefail
          link="[$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)"
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
            echo "Updated $link" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$DRAFT" = true ]; then
            echo "Draft $link is ready, publish it on the Releases page" >> "$GITHUB_STEP_SUMMARY"
          else
            gh release edit "$TAG" --draft=false >/dev/null
            echo "Published $link" >> "$GITHUB_STEP_SUMMARY"
          fi

  build-failed:
    name: Report failed build
    needs: [prepare, checks, desktop, rcmd, downloads, publish]
    if: ${{ (failure() || cancelled()) && github.event_name == 'push' && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Note in a release created on GitHub
        run: |
          set -euo pipefail
          body=$(gh release view "$TAG" --json body --jq .body 2>/dev/null) || exit 0
          # only replace the "being built" note, never the downloads of an earlier run
          if [[ "$body" != *'<!-- building -->'* ]]; then exit 0; fi
          run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > section.md <<EOF
          > **Building the downloads did not finish:** see [the workflow run]($run). **Re-run failed jobs** there adds them to this release.
          <!-- building -->
          EOF
          printf '%s\n' "$body" | bash scripts/release-notes.sh section.md > notes.md
          gh release edit "$TAG" --notes-file notes.md >/dev/null

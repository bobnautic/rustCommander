name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs these checks before publishing

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: UI (typecheck, build, unit + smoke tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - run: npm run test:unit
        working-directory: ui
      # Smoke test of the whole UI against the built-in mock backend (Playwright, Chromium).
      - name: Playwright and Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
        working-directory: ui
      - run: node tests/smoke.mjs
        working-directory: ui
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-smoke-screenshots
          path: ui/tests/screenshots
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Known vulnerabilities in the shipped npm packages (dev tools are not shipped).
      - run: npm audit --omit=dev --audit-level=moderate
        working-directory: ui
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # RustSec advisories for Cargo.lock; accepted exceptions are in .cargo/audit.toml.
      - run: cargo audit

  rust:
    name: Rust (${{ matrix.os }})
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      - name: Headless server binary
        run: cargo build --release -p rc-cli
      - uses: actions/upload-artifact@v7
        with:
          name: rcmd-${{ runner.os }}
          path: |
            target/release/rcmd
            target/release/rcmd.exe
